name: Publish to npm

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # Required for OIDC

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false # Never publish a build made from cached dependencies

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish to npm
              run: npm publish --provenance --access public
